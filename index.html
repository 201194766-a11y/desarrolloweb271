<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de evidencias</title>
    <style>

        header { padding: 20px; background: #eee8fa; }

        header p { margin: 6px 0; }
        .contenido { display: flex; min-height: 65vh; }

        main { padding: 16px 24px; }

        section:target { background: #eee8fa; }

</head>
<body>

    </header>

    <div class="contenido">
        <nav aria-label="Índice">
            <h2>Índice</h2>
            <ul>

                <li><a href="#parcial-2">Parcial 2</a></li>
                <li><a href="#parcial-3">Parcial 3</a></li>
            </ul>
        </nav>

        <main>
            <section id="parcial-1">
                <h2>Parcial 1</h2>
                <p>Agrega aquí tus evidencias.</p>
            </section>

            <section id="parcial-2">

            <section id="parcial-3">

            </section>
        </main>
    </div>
</body>
</html>
